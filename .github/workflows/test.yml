name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  # Runs the real Claude Code CLI through NeoSwitch against a scripted Gemini server (see e2e/). No model or credentials are involved.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned to the version the suite and testdata/claude-code-tools.json were verified with; bump it deliberately.
      - run: npm install -g @anthropic-ai/claude-code@2.1.329
      - run: claude --version
      - run: go test -tags e2e ./...
        env:
          NEOSWITCH_E2E_REQUIRE_CLAUDE: "1"

  # Users get the plugin from the tag that .claude-plugin/marketplace.json pins, so its source always matches the release binary users without Go download; VERSION and the pin move together, and only to a published release (see CONTRIBUTING.md). A pull request opened before the release is published passes once its checks are re-run.
  released-version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: The plugin is pinned to the published release VERSION names
        run: sh .github/scripts/released-version.sh "${{ github.repository }}"
